# the release's checks on pull requests (Dependabot's weekly ones), or by hand
# from the Actions tab. not on every push to main
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check the kit
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test
          npm run build demo
