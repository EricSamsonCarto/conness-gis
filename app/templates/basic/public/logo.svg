<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Top-bar logo: same mountain emoji as the favicon. Modern browsers render
       it as the OS's native color emoji, so it stays crisp at any size and the
       logo + favicon are visually identical. -->
  <text x="50%" y="50%" font-size="56" text-anchor="middle" dominant-baseline="central">⛰️</text>
</svg>
