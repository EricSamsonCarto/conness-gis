<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Mountain emoji as text — modern browsers render this as the OS's native
       color emoji glyph, so the favicon stays crisp at every size with no
       embedded raster. Matches the ⛰️ in the README title. -->
  <text x="50%" y="50%" font-size="56" text-anchor="middle" dominant-baseline="central">⛰️</text>
</svg>
